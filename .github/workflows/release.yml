name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify dist directory exists
        id: check
        run: |
          VERDIR="dist/${{ steps.version.outputs.VERSION }}"
          if [ -d "$VERDIR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "verdir=$VERDIR" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package portable version
        if: steps.check.outputs.exists == 'true'
        run: |
          VERDIR="${{ steps.check.outputs.verdir }}"
          mkdir -p release/portable
          cp "$VERDIR/ZPUI.exe" release/portable/
          cp "$VERDIR/versions.json" release/portable/
          [ -f "$VERDIR/domains.txt" ] && cp "$VERDIR/domains.txt" release/portable/
          [ -f "$VERDIR/skip-resources.txt" ] && cp "$VERDIR/skip-resources.txt" release/portable/
          cp -r "$VERDIR/mods" release/portable/
          cd release/portable && zip -r "../ZPUI-${{ steps.version.outputs.VERSION }}-portable.zip" .

      - name: Package zapret
        if: steps.check.outputs.exists == 'true'
        run: |
          VERDIR="${{ steps.check.outputs.verdir }}"
          if [ -d "$VERDIR/zapret" ]; then
            cd "$VERDIR" && zip -r "$OLDPWD/release/zapret-${{ steps.version.outputs.VERSION }}.zip" zapret/
          fi

      - name: Generate release notes
        if: steps.check.outputs.exists == 'true'
        id: notes
        shell: bash
        run: |
          VERDIR="${{ steps.check.outputs.verdir }}"
          V="${{ steps.version.outputs.VERSION }}"

          NOTES="## ZPUI v${V}\n\n### SHA256 Checksums\n\`\`\`\n"
          for f in "$VERDIR"/*.exe; do
            [ -f "$f" ] || continue
            h=$(sha256sum "$f" | cut -d' ' -f1)
            sz=$(stat -c%s "$f")
            name=$(basename "$f")
            NOTES+="${h}  ${name} (${sz} bytes)\n"
          done
          for f in "$VERDIR"/components/*/*.exe; do
            [ -f "$f" ] || continue
            h=$(sha256sum "$f" | cut -d' ' -f1)
            sz=$(stat -c%s "$f")
            name=$(basename "$(dirname "$f")")/$(basename "$f")
            NOTES+="${h}  ${name} (${sz} bytes)\n"
          done
          NOTES+="\`\`\`\n"

          if [ -f "${VERDIR}/versions.json" ]; then
            NOTES+="\n### Components\n\`\`\`json\n$(cat "${VERDIR}/versions.json")\n\`\`\`\n"
          fi

          printf '%b\n' "$NOTES" > release/notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists == 'true'
        with:
          name: ZPUI v${{ steps.version.outputs.VERSION }}
          body_path: release/notes.md
          files: |
            ${{ steps.check.outputs.verdir }}/ZPUI.exe
            ${{ steps.check.outputs.verdir }}/ZPUI-Setup-*.exe
            ${{ steps.check.outputs.verdir }}/selfupdate.exe
            ${{ steps.check.outputs.verdir }}/report.exe
            ${{ steps.check.outputs.verdir }}/security.exe
            ${{ steps.check.outputs.verdir }}/components/**/*.exe
            ${{ steps.check.outputs.verdir }}/components/**/checksum.sha256
            ${{ steps.check.outputs.verdir }}/components/**/version.txt
            ${{ steps.check.outputs.verdir }}/versions.json
            ${{ steps.check.outputs.verdir }}/checksums.sha256
            release/ZPUI-${{ steps.version.outputs.VERSION }}-portable.zip
            release/zapret-${{ steps.version.outputs.VERSION }}.zip
