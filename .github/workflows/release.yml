name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify dist directory exists
        id: check
        run: |
          VERDIR="dist/${{ steps.version.outputs.VERSION }}"
          if [ -d "$VERDIR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "verdir=$VERDIR" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package portable version
        if: steps.check.outputs.exists == 'true'
        run: |
          VERDIR="${{ steps.check.outputs.verdir }}"
          mkdir -p release/portable
          cp "$VERDIR/ZPUI.exe" release/portable/
          cp "$VERDIR/versions.json" release/portable/
          [ -f "$VERDIR/domains.txt" ] && cp "$VERDIR/domains.txt" release/portable/
          [ -f "$VERDIR/skip-resources.txt" ] && cp "$VERDIR/skip-resources.txt" release/portable/
          cp -r "$VERDIR/mods" release/portable/
          cd release/portable && zip -r "../ZPUI-${{ steps.version.outputs.VERSION }}-portable.zip" .

      - name: Generate release notes
        if: steps.check.outputs.exists == 'true'
        id: notes
        shell: bash
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          awk -v ver="v${V}" '/^## / {if (found) exit; if ($0 ~ "^## " ver) found=1; next} found' CHANGELOG.md > release/notes.md
          [ -s release/notes.md ] || echo "ZPUI v${V}" > release/notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists == 'true'
        with:
          name: ZPUI v${{ steps.version.outputs.VERSION }}
          body_path: release/notes.md
          files: |
            ${{ steps.check.outputs.verdir }}/ZPUI-Setup-*.exe
            release/ZPUI-${{ steps.version.outputs.VERSION }}-portable.zip
