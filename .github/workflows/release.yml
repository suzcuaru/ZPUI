name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify dist directory exists
        id: check
        run: |
          VERDIR="dist/${{ steps.version.outputs.VERSION }}"
          if [ -d "$VERDIR" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "verdir=$VERDIR" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package portable version
        if: steps.check.outputs.exists == 'true'
        run: |
          VERDIR="${{ steps.check.outputs.verdir }}"
          mkdir -p release/portable
          cp "$VERDIR/ZPUI.exe" release/portable/
          cp "$VERDIR/versions.json" release/portable/
          [ -f "$VERDIR/domains.txt" ] && cp "$VERDIR/domains.txt" release/portable/
          [ -f "$VERDIR/skip-resources.txt" ] && cp "$VERDIR/skip-resources.txt" release/portable/
          cp -r "$VERDIR/mods" release/portable/
          cd release/portable && zip -r "../ZPUI-${{ steps.version.outputs.VERSION }}-portable.zip" .

      - name: Package zapret
        if: steps.check.outputs.exists == 'true'
        run: |
          VERDIR="${{ steps.check.outputs.verdir }}"
          if [ -d "$VERDIR/zapret" ]; then
            cd "$VERDIR" && zip -r "$OLDPWD/release/zapret-${{ steps.version.outputs.VERSION }}.zip" zapret/
          fi

      - name: Generate release notes
        if: steps.check.outputs.exists == 'true'
        id: notes
        shell: bash
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)

          NOTES="# ZPUI v${V}\n\n"

          if [ -n "$PREV_TAG" ]; then
            NOTES+="## Список изменений\n\n"

            added=""; fixed=""; changed=""; removed=""; other=""

            while IFS= read -r msg; do
              lc="${msg,,}"
              case "$lc" in
                feat:*|add*|добавл*|нов*|реализован*) added+="  - ${msg}\n" ;;
                fix:*|исправ*|почин*|устран*) fixed+="  - ${msg}\n" ;;
                refactor*|change*|измен*|перепис*|обновл*) changed+="  - ${msg}\n" ;;
                remove*|удал*|del*) removed+="  - ${msg}\n" ;;
                *) other+="  - ${msg}\n" ;;
              esac
            done < <(git log --pretty=format:"%s" "${PREV_TAG}..HEAD" 2>/dev/null)

            [ -n "$added" ]    && NOTES+="### Добавлено\n${added}\n"
            [ -n "$fixed" ]    && NOTES+="### Исправлено\n${fixed}\n"
            [ -n "$changed" ]  && NOTES+="### Изменено\n${changed}\n"
            [ -n "$removed" ]  && NOTES+="### Удалено\n${removed}\n"
            [ -n "$other" ]    && NOTES+="### Прочее\n${other}\n"
          else
            NOTES+="## Первый релиз\n\n"
            while IFS= read -r msg; do
              NOTES+="  - ${msg}\n"
            done < <(git log --pretty=format:"%s" HEAD)
          fi

          printf '%b\n' "$NOTES" > release/notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists == 'true'
        with:
          name: ZPUI v${{ steps.version.outputs.VERSION }}
          body_path: release/notes.md
          files: |
            ${{ steps.check.outputs.verdir }}/ZPUI-Setup-*.exe
            release/ZPUI-${{ steps.version.outputs.VERSION }}-portable.zip
