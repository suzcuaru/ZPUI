name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Verify release files exist
        id: check
        run: |
          if [ ! -f "ZPUI.exe" ] || [ ! -f "versions.json" ]; then
            echo "::error::Release artifacts missing in repo root (ZPUI.exe and/or versions.json). Run release.bat on Windows, commit the refreshed artifacts, then tag."
            exit 1
          fi

      - name: Package portable version
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          # Портатив двухбитный: x64/ZPUI.exe и x86/ZPUI-x86.exe, каждая папка
          # самодостаточна (versions.json + файлы списков рядом с exe).
          mkdir -p release/portable/x64 release/portable/x86
          cp ZPUI.exe release/portable/x64/
          cp ZPUI-x86.exe release/portable/x86/ZPUI.exe || echo "ZPUI-x86.exe missing - x86 portable skipped"
          for d in x64 x86; do
            cp versions.json release/portable/$d/
            [ -f domains.txt ] && cp domains.txt release/portable/$d/
            [ -f skip-resources-system.txt ] && cp skip-resources-system.txt release/portable/$d/
          done
          cd release/portable && zip -r "../ZPUI-${V}-portable.zip" .

      - name: Generate release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          V="${{ steps.version.outputs.VERSION }}"
          if [ -f "CHANGELOG.md" ]; then
            awk -v ver="v${V}" '/^## / {if (found) exit; if ($0 ~ "^## " ver) found=1; next} found' CHANGELOG.md > release/notes.md
          fi
          [ -s release/notes.md ] || echo "ZPUI v${V}" > release/notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ZPUI v${{ steps.version.outputs.VERSION }}
          body_path: release/notes.md
          files: |
            ZPUI-Setup-${{ steps.version.outputs.VERSION }}.exe
            release/ZPUI-${{ steps.version.outputs.VERSION }}-portable.zip
